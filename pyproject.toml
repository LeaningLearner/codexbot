[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbot-qq"
version = "0.1.0"
description = "A Codex lifecycle notification bridge for the official QQ bot sandbox."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "keyring==25.7.0",
  "psutil==7.2.2",
  "qq-botpy==1.1.5",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
]

[project.scripts]
codexbot = "codexbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
